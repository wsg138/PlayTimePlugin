config-version: 4

numerals:
  enabled: true
  # Tier colors accept:
  # - named Minecraft colors: "gray", "dark_aqua", "light_purple"
  # - hex colors: "#55FFAA"
  # - gradients with two or more hex stops: "gradient:#FF5F6D:#FFC371"
  #   MiniMessage-style wrappers also work: "<gradient:#FF5F6D:#FFC371>"
  # Existing legacy colors such as "&7" remain supported.
  # Keep %tier_color%%tier_label% together in display/announcement templates so gradients cover the full label.
  tiers:
    "1": { label: "I", hours: 1, color: "gray" }
    "2": { label: "II", hours: 8, color: "white" }
    "3": { label: "III", hours: 20, color: "green" }
    "4": { label: "IV", hours: 45, color: "yellow" }
    "5": { label: "V", hours: 90, color: "gold" }
    "6": { label: "VI", hours: 170, color: "light_purple" }
    "7": { label: "VII", hours: 320, color: "blue" }
    "8": { label: "VIII", hours: 580, color: "dark_aqua" }
    "9": { label: "IX", hours: 1090, color: "red" }
    "10": { label: "x", hours: 2000, color: "dark_red" }
    "11": { label: "y", hours: 5000, color: "dark_purple" }
    "12": { label: "z", hours: 15000, color: "aqua" }
  tier-up-announcement:
    enabled: false
    message: "&6%player% &ehas reached playtime tier %tier_color%%tier_label%&e!"
  display:
    header: "&6[Playtime] &ePlaytime numeral tiers:"
    current-tier: "&7You (active): &b%playtime% &7-> %tier_color%%tier_label%"
    no-data: "&cNo playtime recorded yet."
    loading: "&eRefreshing cached playtime..."
    tier-entry: "%tier_color%%tier_label%&8:&b%tier_hours%h"
    separator: "&8 | "
    disabled: "&cPlaytime numerals are disabled."

storage:
  # sqlite is the intended default target.
  # mysql and mariadb remain supported for future scale-out if you decide to move later.
  type: sqlite

  sqlite:
    file: "playtime.db"

  mysql:
    host: "localhost"
    port: 3306
    database: "playtime"
    username: "root"
    password: ""
    use-ssl: false
    pool-size: 10

  # How often the buffered minute writer flushes to storage.
  # The plugin batches writes in memory between flushes to reduce disk churn.
  flush-interval-ticks: 1200

sampling:
  # Runtime state is sampled once per second by default. Raw movement events are
  # throttled separately and expensive recurrence analysis is not run per packet.
  tick-interval: 20

  # Legacy-compatible aliases are still accepted internally:
  # idle_seconds / afk_seconds will continue to work if they already exist.
  idle-seconds: 60
  afk-seconds: 300

  suspicion:
    enabled: true

    # Legacy click/autoclick settings remain the canonical click timing thresholds.
    # This preserves custom values from existing installations during migration.
    window-seconds: 20
    min-swings: 25
    # Coefficient of variation. Lower means more mechanically regular timing is required.
    max-cv: 0.08
    # A stationary click-only stream can become suspicious after this much time.
    non-click-grace-seconds: 10

    # Suspicious time still counts as active playtime for the first N consecutive suspicious minutes.
    # Once the streak exceeds this threshold, suspicious minutes stop counting until convincing
    # varied activity clears the detector. Trivial movement/commands/placement do not reset it.
    max-counted-consecutive-minutes: 10

    click:
      enabled: true

    rotation:
      enabled: true
      window-seconds: 30
      minimum-samples: 10
      # Both rotation amounts and timing must be extremely regular.
      max-cv: 0.06

    movement:
      enabled: true
      window-seconds: 45
      minimum-samples: 24
      minimum-cycles: 4
      # Whole cycles must be this similar; normal repetitive gameplay should vary more.
      similarity-threshold: 0.96
      maximum-cycle-samples: 32
      # Prevent tiny alternating packet patterns from becoming a strong standalone signal.
      minimum-cycle-millis: 900

    sequence:
      enabled: true
      window-seconds: 60
      minimum-actions: 12
      minimum-repetitions: 3
      similarity-threshold: 0.95
      maximum-cycle-samples: 40

    scoring:
      # High-confidence hysteresis: entering SUSPICIOUS is intentionally much harder
      # than remaining clear. Prefer a false negative over repeatedly flagging humans.
      suspicious-threshold: 0.86
      clear-threshold: 0.30
      decay-per-second: 0.025
      analysis-interval-ms: 1000
      # Strict per-player memory bound for raw behavior history.
      history-size: 256
      # Suspicion only clears after low evidence plus convincing varied activity.
      recovery-seconds: 15
      # Preserve bounded detector state across quick reconnects so reconnecting is not a reset trick.
      reconnect-retention-seconds: 300
      max-retained-disconnected: 512

activity:
  # Minimum time between movement-based samples for the same player.
  movement-throttle-ms: 250

  # Meaningful camera rotation may count as observed activity and as a detector signal.
  count-head-rotation: true

  # Squared distance threshold used to ignore tiny movement noise.
  tiny-movement-threshold: 0.01

  # Paper arm-swing timing is the primary click timing source when enabled.
  suspicious-swing-tracking-enabled: true

chat:
  count-chat-as-activity: true
  count-commands-as-activity: true

joins:
  # <= 0 keeps all join records forever.
  retention-days: -1

  # Used for first-join / seen formatting and join-range admin stats.
  timezone: "America/New_York"

  first-join:
    enabled: true

    # This plugin now uses plugin-owned storage to determine true first joins.
    broadcast: "&a+ &f%player% &7just joined for the first time! Make them feel welcome."

    player-message:
      - "&aWelcome to Enthusia, %player%!"
      - "&7Use &b/tutorial &7for a quick start or ask in chat."

    ping:
      enabled: true
      sound: BLOCK_NOTE_BLOCK_PLING
      volume: 1.25
      pitch: 1.6

leaderboards:
  default-metric: "total"
  default-range: "all"

  # Cached leaderboard results are reused by placeholder lookups and GUI reads.
  cache-ttl-seconds: 30
  max-pages: 100
  cache-max-entries: 512

  export:
    # Writes one website-safe JSON snapshot under the plugin data folder:
    # board: playtime-active-all, top 100, ordered by all-time active minutes.
    # The website/API can read these files without connecting to the Minecraft plugin.
    enabled: true
    directory: "public-leaderboards"
    interval-seconds: 300

    # Optional Cloudflare R2 upload. This is useful on hosted panels where you cannot run
    # rclone or cron jobs. Create an R2 API token with read/write access to this bucket,
    # then fill in the access key values in your live server config.yml.
    r2:
      enabled: false
      account-id: ""
      bucket: "playtime-leaderboard"
      access-key-id: ""
      secret-access-key: ""
      prefix: "leaderboards"

    run-on-reload-close: false
    run-on-disable: true
    shutdown-timeout-seconds: 10

playtime-audit:
  enabled: true
  interval-minutes: 5
  max-players-per-tick: 1
  repair-mode: true
  debug-log-repairs: false

analytics:
  # Optional Plan Player Analytics integration. Requires the Plan plugin to be installed.
  # When enabled, this plugin exposes stored playtime and join analytics through Plan's DataExtension API.
  plan:
    enabled: true

  # Retention for hourly playtime aggregates used for true rolling 24-hour analytics.
  hourly-retention-days: 90

gui:
  enabled: true
  filler-material: GRAY_STAINED_GLASS_PANE

  bedrock:
    enabled: true
    main-menu-rows: 5
    leaderboard-rows: 6

placeholders:
  enabled: true
  leaderboard-fallback: ""
  top-leaderboard-max-rank: 100
  # Global leaderboard placeholders are not player-relative.
  # Format: %playtime_top_<type>_<range>_<rank>_<field>%
  # Types: active, total, afk
  # Ranges: all, today, 7d, 30d
  # Ranks: 1 through top-leaderboard-max-rank
  # Fields: name, uuid, value, formatted
  # value returns raw minutes
  # Examples:
  # %playtime_top_active_all_1_name%
  # %playtime_top_active_all_1_uuid%
  # %playtime_top_active_all_1_value%
  # %playtime_top_active_all_1_formatted%

ux:
  show-afk-title: false

  actionbar:
    enabled: true
    show-active: false
    show-idle: false
    show-afk: true
    show-suspicious: true

    text:
      active: "Playing"
      idle: "Idle"
      afk: "AFK"
      suspicious: "Suspicious input"

debug:
  enabled: false
  log-suspicious: true
  performance:
    enabled: false
    log-interval-seconds: 300
