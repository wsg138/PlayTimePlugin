name: EnthusiaPlaytime
main: org.enthusia.playtime.PlayTimePlugin
version: 3.7.1
api-version: '1.21'
author: Enthusia
description: Advanced playtime tracking with AFK detection, GUIs, leaderboards, admin tools, and PlaceholderAPI support.

softdepend:
  - Plan
  - PlaceholderAPI
  - ProtocolLib
  - floodgate
  - Geyser-Spigot

commands:
  playtime:
    description: View playtime statistics and leaderboards.
    aliases: [pt]
    permission: playtime.base
  roman:
    description: View playtime numeral progression.
    aliases: [numerals, rn]
    permission: playtime.base
  firstjoin:
    description: View first-join information.
    aliases: [fj]
  seen:
    description: View a player's last-seen time.
    permission: playtime.seen

permissions:
  playtime.base:
    default: true
    description: Use the playtime GUI, leaderboards, and numeral display.
  playtime.others:
    default: op
    description: View another player's ordinary playtime data.
  playtime.seen:
    default: op
    description: View another player's last-seen time.
  playtime.admin.base:
    default: op
    description: Open admin GUI screens.
  playtime.admin.reload:
    default: op
    description: Reload the playtime plugin safely in-place.
  playtime.admin.debug:
    default: op
    description: View playtime debug/performance information.
