name: Deep Review PR 9

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run focused placeholder and numeral tests
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dtest=TierColorFormatterTest,PlaytimePlaceholderExpansionTest,NumeralConfigurationTest
          test

      - name: Check out exact base revision
        run: git worktree add ../base "${{ github.event.pull_request.base.sha }}"

      - name: Compare complete Maven verification with base
        shell: bash
        run: |
          set +e
          mvn --batch-mode --no-transfer-progress clean verify > pr-verify.log 2>&1
          PR_EXIT=$?
          (
            cd ../base
            mvn --batch-mode --no-transfer-progress clean verify > "$GITHUB_WORKSPACE/base-verify.log" 2>&1
          )
          BASE_EXIT=$?
          set -e
          export PR_EXIT BASE_EXIT

          python3 <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def failed_tests(root: Path):
              failures = set()
              for report in root.glob('**/target/surefire-reports/TEST-*.xml'):
                  try:
                      suite = ET.parse(report).getroot()
                  except ET.ParseError:
                      continue
                  for case in suite.iter('testcase'):
                      if case.find('failure') is not None or case.find('error') is not None:
                          failures.add(f"{case.get('classname')}#{case.get('name')}")
              return sorted(failures)

          pr_failures = failed_tests(Path('.'))
          base_failures = failed_tests(Path('../base'))
          pr_exit = int(os.environ['PR_EXIT'])
          base_exit = int(os.environ['BASE_EXIT'])

          print(f'PR Maven exit: {pr_exit}')
          print(f'Base Maven exit: {base_exit}')
          print('PR failures:')
          print('\n'.join(pr_failures) if pr_failures else '(none)')
          print('Base failures:')
          print('\n'.join(base_failures) if base_failures else '(none)')

          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a', encoding='utf-8') as out:
              out.write('## Full Maven comparison\n')
              out.write(f'- PR exit: `{pr_exit}`\n')
              out.write(f'- Base exit: `{base_exit}`\n')
              out.write(f'- PR failed tests: `{len(pr_failures)}`\n')
              out.write(f'- Base failed tests: `{len(base_failures)}`\n')
              for failure in pr_failures:
                  out.write(f'  - `{failure}`\n')

          if pr_exit != base_exit:
              raise SystemExit('PR and base Maven outcomes differ')
          if pr_failures != base_failures:
              raise SystemExit('PR and base failed-test sets differ')
          if pr_exit != 0 and not pr_failures:
              raise SystemExit('Both builds failed without an attributable matching test failure set')
          PY

      - name: Package final plugin JAR
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      - name: Verify packaged JAR contents
        run: |
          test -f target/playtime-plugin-3.5.11.jar
          jar tf target/playtime-plugin-3.5.11.jar | grep -Fx 'plugin.yml'
          jar tf target/playtime-plugin-3.5.11.jar | grep -Fx 'org/enthusia/playtime/placeholders/PlaytimePlaceholderExpansion.class'
          jar tf target/playtime-plugin-3.5.11.jar | grep -Fx 'org/enthusia/playtime/util/TierColorFormatter.class'
          sha256sum target/playtime-plugin-3.5.11.jar

      - name: Upload final plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: PlayTimePlugin-3.5.11-PR9-deep-review
          path: target/playtime-plugin-3.5.11.jar
          if-no-files-found: error
          retention-days: 1

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PR9-deep-review-logs
          path: |
            pr-verify.log
            base-verify.log
          if-no-files-found: warn
          retention-days: 1
