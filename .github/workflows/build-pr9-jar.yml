name: Build PR 9 JAR

on:
  push:
    branches:
      - agent/build-pr9-jar

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Package plugin
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      - name: Verify packaged JAR
        run: |
          test -f target/playtime-plugin-3.5.11.jar
          jar tf target/playtime-plugin-3.5.11.jar | grep -Fx 'plugin.yml'
          jar tf target/playtime-plugin-3.5.11.jar | grep -Fx 'org/enthusia/playtime/placeholders/PlaytimePlaceholderExpansion.class'

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: PlayTimePlugin-3.5.11-PR9
          path: target/playtime-plugin-3.5.11.jar
          if-no-files-found: error
          retention-days: 1
