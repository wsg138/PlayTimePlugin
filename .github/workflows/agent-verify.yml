name: Agent final validation

on:
  push:
    branches:
      - agent/playtime-minimessage-placeholder
  pull_request:

permissions:
  contents: read

jobs:
  focused-feature-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run focused MiniMessage numeral tests
        run: mvn --batch-mode --no-transfer-progress -Dtest=TierColorFormatterTest,PlaytimePlaceholderExpansionTest,NumeralConfigurationTest test

  verify-feature-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify feature branch
        run: mvn --batch-mode --no-transfer-progress clean verify

  verify-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d2d768b3a73826a520a98c1f06a1768e5f3e0c1c
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify untouched base commit
        run: mvn --batch-mode --no-transfer-progress clean verify
