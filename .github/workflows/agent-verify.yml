name: Agent baseline validation
on:
  pull_request:
permissions:
  contents: read
jobs:
  verify-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d2d768b3a73826a520a98c1f06a1768e5f3e0c1c
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify live main baseline
        run: mvn --batch-mode --no-transfer-progress clean verify
