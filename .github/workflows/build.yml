name: Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          mvn --batch-mode --no-transfer-progress -DreuseForks=false clean package 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          if-no-files-found: error

      - name: Verify plugin packaging
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*' | head -n 1)
          test -n "$JAR"

          jar tf "$JAR" | grep -q '^org/sqlite/JDBC.class$'
          if jar tf "$JAR" | grep -q '^org/enthusia/playtime/shaded/sqlite/'; then
            echo 'sqlite-jdbc was incorrectly relocated'
            exit 1
          fi

          POM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          PLUGIN_VERSION=$(unzip -p "$JAR" plugin.yml | sed -n 's/^version:[[:space:]]*//p' | tr -d "'\"")
          if [ "$PLUGIN_VERSION" != "$POM_VERSION" ]; then
            echo "plugin.yml version $PLUGIN_VERSION does not match Maven version $POM_VERSION"
            exit 1
          fi

      - name: Prepare Sentinel regression artifact
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*' | head -n 1)
          test -n "$JAR"

          rm -rf /tmp/enthusia-playtime-sentinel
          mkdir -p /tmp/enthusia-playtime-sentinel/target /tmp/enthusia-playtime-sentinel/fixtures
          cp "$JAR" /tmp/enthusia-playtime-sentinel/target/EnthusiaPlaytime.jar
          cp sentinel/fixtures/EnthusiaPlaytime-config.yml \
            /tmp/enthusia-playtime-sentinel/fixtures/EnthusiaPlaytime-config.yml
          python3 scripts/create-sentinel-playtime-fixture.py \
            /tmp/enthusia-playtime-sentinel/fixtures/EnthusiaPlaytime-playtime.db

          FIXTURE=/tmp/enthusia-playtime-sentinel/fixtures/EnthusiaPlaytime-playtime.db \
          python3 - <<'PY'
          import os
          import sqlite3

          path = os.environ['FIXTURE']
          with sqlite3.connect(path) as connection:
              columns = {row[1] for row in connection.execute('PRAGMA table_info(lifetime_agg)')}
              if 'last_seen' in columns:
                  raise SystemExit('legacy fixture unexpectedly already contains lifetime_agg.last_seen')
              active = connection.execute(
                  "SELECT active_minutes FROM lifetime_agg WHERE player_uuid = ?",
                  ('00000000-0000-0000-0000-000000000001',),
              ).fetchone()
              if active != (1234,):
                  raise SystemExit(f'unexpected lifetime canary before upload: {active!r}')
              check = connection.execute('PRAGMA quick_check').fetchone()
              if check != ('ok',):
                  raise SystemExit(f'fixture quick_check failed: {check!r}')
          PY

      - name: Upload Sentinel regression artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enthusiaplaytime-plugin
          path: /tmp/enthusia-playtime-sentinel/
          if-no-files-found: error
          retention-days: 30

      - name: Upload plugin JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EnthusiaPlaytime-${{ github.sha }}
          path: target/playtime-plugin-*.jar
          if-no-files-found: error
