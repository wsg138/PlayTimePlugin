name: Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Verify SQLite packaging
        run: |
          JAR=$(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*' | head -n 1)
          test -n "$JAR"
          jar tf "$JAR" | grep -q '^org/sqlite/JDBC.class$'
          if jar tf "$JAR" | grep -q '^org/enthusia/playtime/shaded/sqlite/'; then
            echo 'sqlite-jdbc was incorrectly relocated'
            exit 1
          fi

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: EnthusiaPlaytime-${{ github.sha }}
          path: target/playtime-plugin-*.jar
          if-no-files-found: error
