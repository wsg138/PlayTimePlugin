name: Agent schema patch

on:
  push:
    branches:
      - agent/placeholder-reload-mariadb-migration

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[agent-schema-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply portable schema metadata migration
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          repository_path = Path("src/main/java/org/enthusia/playtime/data/PlaytimeRepository.java")
          source = repository_path.read_text()
          source = source.replace(
              "                tryAddLastSeenColumn(statement);",
              "                ensureLastSeenColumn(connection, statement);",
              1,
          )

          old_method = '''    private void tryAddLastSeenColumn(Statement statement) {
                  boolean columnExists = false;
                  try {
                      statement.execute(dialect.lifetimeAggAddLastSeenColumn());
                      columnExists = true;
                  } catch (SQLException exception) {
                      String message = exception.getMessage();
                      if (message == null) {
                          return;
                      }
                      String normalized = message.toLowerCase(Locale.ROOT);
                      if (normalized.contains("duplicate column")
                              || normalized.contains("already exists")
                              || normalized.contains("duplicate")) {
                          columnExists = true;
                      } else {
                          plugin.getLogger().warning("Failed while ensuring lifetime_agg.last_seen exists: " + exception.getMessage());
                      }
                  }

                  if (!columnExists) {
                      return;
                  }

                  try {
                      statement.executeUpdate(dialect.lifetimeAggBackfillLastSeenColumn());
                  } catch (SQLException exception) {
                      plugin.getLogger().warning("Failed while backfilling lifetime_agg.last_seen: " + exception.getMessage());
                  }
              }
          '''

          new_method = '''    private void ensureLastSeenColumn(Connection connection, Statement statement) {
                  boolean columnExists;
                  try {
                      columnExists = columnExists(connection, "lifetime_agg", "last_seen");
                  } catch (SQLException exception) {
                      plugin.getLogger().warning("Failed to inspect lifetime_agg.last_seen metadata; falling back to the legacy migration check: "
                              + exception.getMessage());
                      columnExists = false;
                  }

                  if (!columnExists) {
                      try {
                          statement.execute(dialect.lifetimeAggAddLastSeenColumn());
                          columnExists = true;
                      } catch (SQLException exception) {
                          if (isDuplicateColumn(exception)) {
                              columnExists = true;
                          } else {
                              plugin.getLogger().warning("Failed while ensuring lifetime_agg.last_seen exists: "
                                      + exception.getMessage());
                          }
                      }
                  }

                  if (!columnExists) {
                      return;
                  }

                  try {
                      statement.executeUpdate(dialect.lifetimeAggBackfillLastSeenColumn());
                  } catch (SQLException exception) {
                      plugin.getLogger().warning("Failed while backfilling lifetime_agg.last_seen: " + exception.getMessage());
                  }
              }

              static boolean columnExists(Connection connection, String tableName, String columnName) throws SQLException {
                  java.sql.DatabaseMetaData metadata = connection.getMetaData();
                  String catalog = connection.getCatalog();
                  String[] tableNames = {tableName, tableName.toUpperCase(Locale.ROOT), tableName.toLowerCase(Locale.ROOT)};
                  String[] columnNames = {columnName, columnName.toUpperCase(Locale.ROOT), columnName.toLowerCase(Locale.ROOT)};
                  for (String table : tableNames) {
                      for (String column : columnNames) {
                          try (ResultSet columns = metadata.getColumns(catalog, null, table, column)) {
                              if (columns.next()) {
                                  return true;
                              }
                          }
                      }
                  }
                  return false;
              }

              private boolean isDuplicateColumn(SQLException exception) {
                  String message = exception.getMessage();
                  if (message == null) {
                      return false;
                  }
                  String normalized = message.toLowerCase(Locale.ROOT);
                  return normalized.contains("duplicate column")
                          || normalized.contains("already exists")
                          || normalized.contains("duplicate");
              }
          '''

          if old_method not in source:
              raise SystemExit("Expected tryAddLastSeenColumn method was not found")
          repository_path.write_text(source.replace(old_method, new_method, 1))

          # Restore SqlDialect exactly from main; portability now lives in the metadata check.
          main_sql_dialect = subprocess.check_output(
              ["git", "show", "origin/main:src/main/java/org/enthusia/playtime/data/SqlDialect.java"],
              text=True,
          )
          Path("src/main/java/org/enthusia/playtime/data/SqlDialect.java").write_text(main_sql_dialect)

          obsolete_test = Path("src/test/java/org/enthusia/playtime/data/SqlDialectMigrationTest.java")
          obsolete_test.unlink(missing_ok=True)

          test_path = Path("src/test/java/org/enthusia/playtime/data/SchemaMetadataMigrationTest.java")
          test_path.write_text('''package org.enthusia.playtime.data;

          import org.junit.jupiter.api.Test;

          import java.sql.Connection;
          import java.sql.DatabaseMetaData;
          import java.sql.ResultSet;

          import static org.junit.jupiter.api.Assertions.assertFalse;
          import static org.junit.jupiter.api.Assertions.assertTrue;
          import static org.mockito.ArgumentMatchers.any;
          import static org.mockito.ArgumentMatchers.anyString;
          import static org.mockito.ArgumentMatchers.isNull;
          import static org.mockito.Mockito.mock;
          import static org.mockito.Mockito.when;

          class SchemaMetadataMigrationTest {

              @Test
              void detectsExistingColumnBeforeRunningAlterTable() throws Exception {
                  Connection connection = mock(Connection.class);
                  DatabaseMetaData metadata = mock(DatabaseMetaData.class);
                  ResultSet columns = mock(ResultSet.class);
                  when(connection.getMetaData()).thenReturn(metadata);
                  when(connection.getCatalog()).thenReturn("playtime");
                  when(metadata.getColumns(anyString(), isNull(), anyString(), anyString())).thenReturn(columns);
                  when(columns.next()).thenReturn(true);

                  assertTrue(PlaytimeRepository.columnExists(connection, "lifetime_agg", "last_seen"));
              }

              @Test
              void reportsMissingColumnAfterCheckingIdentifierCaseVariants() throws Exception {
                  Connection connection = mock(Connection.class);
                  DatabaseMetaData metadata = mock(DatabaseMetaData.class);
                  ResultSet columns = mock(ResultSet.class);
                  when(connection.getMetaData()).thenReturn(metadata);
                  when(connection.getCatalog()).thenReturn(null);
                  when(metadata.getColumns(isNull(), isNull(), anyString(), anyString())).thenReturn(columns);
                  when(columns.next()).thenReturn(false);

                  assertFalse(PlaytimeRepository.columnExists(connection, "lifetime_agg", "last_seen"));
              }
          }
          ''')

          Path(".github/workflows/agent-schema-patch.yml").unlink()

      - name: Commit portable migration fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use metadata for idempotent last_seen migration [agent-schema-patched]"
          git push
